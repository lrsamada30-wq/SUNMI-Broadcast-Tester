name: Build SUNMI Broadcast Tester APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar Java 17 para Android SDK Command Line Tools
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configurar Android SDK e instalar componentes
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          "$SDKMANAGER" --licenses < <(printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n')

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      # 4. Configurar Java 8 para Gradle 4.6
      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # 5. Dar permisos al ejecutable Gradle
      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      # 6. Compilar APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. Comprobar que se generó la APK
      - name: Verify APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se encontró ninguna APK"
            exit 1
          fi

          echo "APK generada correctamente:"
          ls -lh "$APK"

      # 8. Publicar APK como artefacto descargable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUNMI-Broadcast-Tester-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
