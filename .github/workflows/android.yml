
name: Build SUNMI Broadcast Tester APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 17 para Android SDK
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Configurar Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager no encontrado"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          # Aceptar licencias evitando el error Broken pipe
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail

          # Instalar componentes necesarios
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"

      # Java 8 para Android Gradle Plugin 3.2.1
      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # Instalar Gradle 4.6 (el proyecto no tiene gradlew)
      - name: Setup Gradle 4.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.6'

      # Comprobar estructura del proyecto
      - name: Verify project structure
        run: |
          echo "Directorio del proyecto:"
          pwd

          echo "Archivos:"
          ls -la

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Estructura correcta"

      # Compilar APK
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # Verificar APK
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se generó la APK"
            find app/build/outputs -type f || true
            exit 1
          fi

          echo "APK generada:"
          ls -lh "$APK"

      # Publicar APK descargable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUNMI-Broadcast-Tester-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
