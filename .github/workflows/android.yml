      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: No se encontró sdkmanager"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          # Aceptar licencias sin provocar Broken pipe
          "$SDKMANAGER" --licenses < <(printf 'y\ny\ny\ny\ny\ny\ny\ny\ny\ny\n')

          # Instalar componentes necesarios
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-28" \
            "build-tools;28.0.3"
